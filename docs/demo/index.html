<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --text: #1d1d1f;
  --muted: #6b6b73;
  --faint: #a8a8b0;
  --line: #e6e4df;
  --chip: rgba(0, 0, 0, .05);
  --hover: rgba(0, 0, 0, .028);
  --focus: rgba(0, 0, 0, .045);
  --accent: #4f46e5;
  --shadow: 0 12px 32px rgba(20, 20, 30, .14), 0 2px 6px rgba(20, 20, 30, .06);
  --u-light: 40%;
  --u-bg-a: .13;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131315;
    --surface: #1c1c1f;
    --text: #ececef;
    --muted: #9b9ba5;
    --faint: #5c5c66;
    --line: #2a2a2f;
    --chip: rgba(255, 255, 255, .07);
    --hover: rgba(255, 255, 255, .03);
    --focus: rgba(255, 255, 255, .05);
    --accent: #8b85ff;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --u-light: 66%;
    --u-bg-a: .2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131315;
  --surface: #1c1c1f;
  --text: #ececef;
  --muted: #9b9ba5;
  --faint: #5c5c66;
  --line: #2a2a2f;
  --chip: rgba(255, 255, 255, .07);
  --hover: rgba(255, 255, 255, .03);
  --focus: rgba(255, 255, 255, .05);
  --accent: #8b85ff;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --u-light: 66%;
  --u-bg-a: .2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.titlebar { display: flex; align-items: baseline; gap: 10px; padding-top: 18px; }
.titlebar h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; font-weight: 700; }
#today { color: var(--muted); font-size: 13px; }
.sync { font-size: 12px; color: var(--faint); cursor: default; }
.sync.warn { color: hsl(30 90% 48%); }
.spacer { flex: 1; }
.icon-btn {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }

.tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 12px 0 8px; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; background: none; cursor: pointer;
  padding: 5px 12px; border-radius: 999px; color: var(--muted); font-size: 14px; white-space: nowrap;
}
.tab:hover { background: var(--hover); color: var(--text); }
.tab.on { background: var(--surface); color: var(--text); border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.05); font-weight: 600; }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tab .n { font-size: 12px; color: var(--faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.tab .edit { opacity: .5; display: none; }
.tab.on .edit { display: inline; }
.tab.add { color: var(--faint); padding: 5px 10px; }
.tab.all .dots { display: inline-flex; }
.tab.all .dots i { width: 7px; height: 7px; border-radius: 50%; margin-left: -2px; border: 1.5px solid var(--bg); box-sizing: content-box; }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 0 0 10px; flex-wrap: wrap; min-height: 30px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.mixstate { font-size: 12.5px; color: var(--faint); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12.5px; padding: 2px 4px; border-radius: 4px; }
.linkbtn:hover { text-decoration: underline; }
.tbtn { border: 0; background: none; font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; display: inline-flex; gap: 6px; align-items: center; }
.tbtn:hover { background: var(--hover); color: var(--text); }
.tbtn input { margin: 0; accent-color: var(--accent); }
[hidden] { display: none !important; }

/* Lists */
main { padding-top: 10px; padding-bottom: 8px; }
.sec { display: flex; align-items: center; gap: 8px; margin: 18px 0 2px; padding-left: 10px; }
.sec:first-child { margin-top: 4px; }
.sec .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.sec .name { border: 0; background: none; font-weight: 650; font-size: 14px; cursor: pointer; padding: 0; }
.sec .name:hover { text-decoration: underline; }
.sec .n { font-size: 12px; color: var(--faint); }
.list { position: relative; padding: 2px 0 26px; }

.row {
  --depth: 0;
  position: relative;
  display: flex; align-items: flex-start; gap: 4px;
  padding: 0 6px 0 calc(8px + var(--depth) * 26px);
  border-radius: 9px;
  background-color: transparent;
  background-image: linear-gradient(90deg, transparent 30%, var(--tint, transparent));
}
.row::before {
  content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 3px;
  background: var(--pc); opacity: .95;
}
.row:not([data-depth="0"])::before { opacity: .35; }
.row:hover { background-color: var(--hover); }
.row:focus-within { background-color: var(--focus); }
.row.hidden { display: none; }
.row.urgent { --tint: hsl(var(--uh) 95% 55% / calc(.04 + var(--ul) * var(--u-bg-a))); }
.row.overdue { --tint: hsl(0 90% 55% / calc(var(--u-bg-a) + .04)); }

.grip {
  flex: none; width: 18px; height: 35px; display: grid; place-items: center;
  color: var(--faint); cursor: grab; opacity: 0; touch-action: none; transition: opacity .12s;
}
.row:hover .grip, .row:focus-within .grip { opacity: 1; }
.grip:hover { color: var(--text); }
.ghost .grip { visibility: hidden; }

.check {
  flex: none; width: 18px; height: 18px; margin: 8.5px 6px 0 0; padding: 0;
  border-radius: 50%; border: 1.75px solid var(--pc); background: transparent; cursor: pointer;
  display: grid; place-items: center; color: transparent; transition: background .15s;
}
.check:hover { background: color-mix(in srgb, var(--pc) 18%, transparent); }
.check svg { width: 11px; height: 11px; }
.done .check { background: var(--pc); color: #fff; }
.ghost .check { border-style: dashed; border-color: var(--faint); cursor: default; color: var(--faint); }
.ghost .check:hover { background: none; }
.ghost .gdot { border: 0; background: var(--pc); cursor: pointer; }
.ghost .gdot:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent); background: var(--pc); }

.text {
  flex: 1; min-width: 0; padding: 6px 0; outline: none;
  white-space: pre-wrap; overflow-wrap: anywhere; cursor: text;
}
.done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.text:empty::before { content: attr(data-placeholder); color: var(--faint); pointer-events: none; }
.row:not(.ghost) .text:empty::before { content: ''; }

.meta {
  flex: none; display: flex; gap: 4px; align-items: center; margin-top: 6px;
  border: 0; background: none; padding: 2px; border-radius: 7px; cursor: pointer; max-width: 50%;
}
.meta:hover .chip { filter: brightness(.96); }
.chip {
  position: relative; overflow: hidden;
  font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 999px;
  background: var(--chip); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: calc(var(--r) * 100%); background: currentColor; opacity: .55; }
.chip.add { background: none; padding: 1px 4px; opacity: 0; display: grid; place-items: center; height: 20px; }
.chip.add svg { width: 15px; height: 15px; }
.row:hover .chip.add, .row:focus-within .chip.add { opacity: .7; }
.urgent .chip.due { color: hsl(var(--uh) 85% var(--u-light)); background: hsl(var(--uh) 90% 50% / .15); font-weight: 600; }
.overdue .chip.due { color: #fff; background: hsl(0 78% 50%); font-weight: 600; animation: pulse 2.4s ease-in-out infinite; }
.done .chip:not(.add) { opacity: .55; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px hsl(0 80% 55% / .25); } }

@media (hover: none) {
  .grip { opacity: .45; }
  .chip.add { opacity: .4; }
}

/* Drag */
.row.dragging { z-index: 10; background-color: var(--surface); box-shadow: var(--shadow); transition: transform .09s ease-out; pointer-events: none; }
.row.drop-parent {
  background-color: color-mix(in srgb, var(--pc) 10%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--pc) 60%, transparent);
}
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
.drop-ind {
  position: absolute; right: 6px; height: 3px; border-radius: 2px; pointer-events: none;
  background: var(--ic, var(--accent)); z-index: 30;
  box-shadow: 0 0 0 2px var(--bg);
}
.drop-ind::before {
  content: ''; position: absolute; left: -5px; top: -3px; width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--ic, var(--accent)); background: var(--bg); box-sizing: border-box;
}

/* Popover */
#pop {
  position: fixed; z-index: 50; width: 316px; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 14px; font-size: 13.5px;
}
#pop h3 { margin: 0 0 10px; font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#pop .lbl { font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
#pop .lbl:first-of-type { margin-top: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 5px; }
.opt {
  border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text);
}
.opt:hover { background: var(--hover); }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.opt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.inrow { display: flex; gap: 6px; align-items: center; margin-top: 7px; }
.inrow input {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
}
.inrow input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: -1px; }
.status {
  margin-top: 12px; padding: 8px 10px; border-radius: 9px; background: var(--chip); font-size: 12.5px; color: var(--muted);
}
.status b { color: var(--text); font-weight: 600; }
.meter { height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.popfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.danger { border: 0; background: none; color: hsl(0 70% 52%); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 13px; }
.danger:hover { background: hsl(0 80% 50% / .1); }
.danger:disabled { opacity: .4; cursor: default; background: none; }
.hint { font-size: 11.5px; color: var(--faint); }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 7px 9px; border-radius: 7px; cursor: pointer; gap: 10px; }
.menu button:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
kbd {
  font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line); border-bottom-width: 2px; background: var(--bg); color: var(--text);
}
.keys-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 13px; }

footer.keys .wrap {
  display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: center; padding: 8px 16px 40px;
  font-size: 11.5px; color: var(--faint);
}
footer.keys span { white-space: nowrap; }
@media (max-width: 640px) { footer.keys { display: none; } }

#lists:focus { outline: none; }
.row.selected, .row.selected:hover { background-color: color-mix(in srgb, var(--accent) 15%, transparent); }
.row.selected .grip { opacity: 1; }
#selbar {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 55;
  display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13.5px;
}
#selcount { font-weight: 600; margin-right: 6px; white-space: nowrap; }
#selbar button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--text); white-space: nowrap; }
#selbar button:hover { background: var(--hover); }
#selbar [data-sel="delete"] { color: hsl(0 70% 52%); }
#toast {
  position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 60;
  background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 10px 9px 14px;
  font-size: 13.5px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100vw - 32px);
}
#toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <h1>Tasks</h1>
      <span id="today"></span>
      <span class="sync" id="sync"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="menuBtn" aria-label="Menu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Projects"></nav>
    <div class="toolbar">
      <div class="seg" id="modeSeg">
        <button data-mode="mix" title="All projects woven into one priority list">Interleaved</button>
        <button data-mode="group" title="Each project in its own section">Grouped</button>
      </div>
      <span class="mixstate" id="mixState"></span>
      <button class="linkbtn" id="resetMix">Reset to round-robin</button>
      <span class="spacer"></span>
      <label class="tbtn"><input type="checkbox" id="hideDone"> Hide done</label>
      <button class="tbtn" id="clearDone">Clear done</button>
    </div>
  </div>
</header>

<main class="wrap" id="lists" tabindex="-1"></main>

<footer class="keys"><div class="wrap">
  <span><kbd>Enter</kbd> new task</span>
  <span><kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
  <span><kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> indent</span>
  <span><kbd>Alt</kbd>+<kbd>↑↓</kbd> move</span>
  <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> done</span>
  <span><kbd>Ctrl</kbd>+<kbd>.</kbd> deadline / estimate</span>
  <span><kbd>Shift</kbd>+<kbd>↑↓</kbd> or <kbd>Shift</kbd>+click select</span>
</div></footer>

<div id="pop" hidden></div>
<div id="toast" hidden></div>
<div id="selbar" hidden>
  <span id="selcount"></span>
  <button data-sel="done">Done</button>
  <button data-sel="details">Deadline…</button>
  <button data-sel="delete">Delete</button>
  <button data-sel="clear" aria-label="Clear selection" title="Clear selection (Esc)">✕</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ───────────── constants & helpers ───────────── */
const KEY = 'tasklist.v1';
const PALETTE = ['#6366f1', '#f97316', '#10b981', '#ec4899', '#0ea5e9', '#eab308', '#8b5cf6', '#ef4444', '#14b8a6', '#64748b'];
const INDENT = 26;
// With a deadline but no estimate, treat the task as needing this long when computing urgency.
const DEFAULT_EST_MIN = 12 * 60;
const H = 36e5;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const ICON = {
  grip: '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>',
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.4 2.4 4.6-5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plus: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2.5v7M2.5 6h7"/></svg>',
  pencil: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
};

let PLAINTEXT = false;
try { const p = document.createElement('div'); p.contentEditable = 'plaintext-only'; PLAINTEXT = p.contentEditable === 'plaintext-only'; } catch {}

/* ───────────── state ─────────────
   projects[].items is each project's priority-ordered outline: a flat [{id, depth}] list.
   mix is the interleaved view's slot pattern: a sequence of project ids, one per top-level block.
   Slots beyond the pattern (or with no tasks left) fall back to round-robin.               */
let S = load();

function fresh() {
  const p = { id: uid(), name: 'Personal', color: PALETTE[0], items: [] };
  return { v: 1, projects: [p], tasks: {}, mix: [], view: 'all', allMode: 'mix', hideDone: false, lastProject: p.id, theme: 'auto' };
}

function seed() {
  const s = fresh();
  const p1 = s.projects[0];
  const p2 = { id: uid(), name: 'Acme Co', color: PALETTE[1], items: [] };
  s.projects.push(p2);
  const now = Date.now();
  const add = (p, text, depth = 0, extra = {}) => {
    const t = { id: uid(), text, done: false, project: p.id, deadline: null, estimate: null, created: now, ...extra };
    s.tasks[t.id] = t;
    p.items.push({ id: t.id, depth });
  };
  add(p1, 'Type like a text editor: Enter adds a task, Shift+Enter adds a line');
  add(p1, 'Tab makes a subtask, Shift+Tab undoes it', 1);
  add(p1, 'Drag the ⠿ handle (or Alt+↑/↓) to change priority');
  add(p1, 'Click the chip to set a deadline and a time estimate', 0, { deadline: now + 3 * H, estimate: 120 });
  add(p1, 'Book flights', 0, { deadline: now + 50 * H });
  add(p2, 'Draft proposal', 0, { deadline: now + 5 * H, estimate: 240 });
  add(p2, 'Outline', 1, { done: true });
  add(p2, 'Pricing section', 1);
  add(p2, 'Send invoice', 0, { deadline: now + 26 * H, estimate: 30 });
  return s;
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.projects) && s.tasks) { delete s._rev; delete s._synced; return repair(s); }
  } catch {}
  return seed();
}

function repair(s) {
  s.mix = Array.isArray(s.mix) ? s.mix : [];
  s.view ||= 'all'; s.allMode ||= 'mix'; s.theme ||= 'auto';
  if (!s.projects.length) s.projects.push({ id: uid(), name: 'Personal', color: PALETTE[0], items: [] });
  const seen = new Set();
  for (const p of s.projects) {

/* ───────────── persistence ─────────────

}

async function push() {
  if (!online || pushing) return;
  const data = JSON.stringify(dataOf(S));
  if (data === lastSynced) return setSync('saved');
  pushing = true;
  setSync('saving');
  let ok = false;
  try {
    const r = await fetch('api/state', {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: `{"baseRev":${rev},"data":${data}}`,
    });
    if (r.status === 409) { adopt(await r.json()); toast('Updated with changes made in another window'); ok = true; }
    else if (r.ok) { rev = (await r.json()).rev; lastSynced = data; ok = true; cacheLocal(); }
  } catch {}
  pushing = false;
  if (!ok) { setSync('offline'); clearTimeout(retryTimer); retryTimer = setTimeout(push, 5000); return; }
  if (JSON.stringify(dataOf(S)) !== lastSynced) push(); else setSync('saved');
}

// Replace our data with the server's, keeping this browser's view prefs and the caret.
function adopt(server) {
  rev = server.rev;
  S = repair({ ...server.data, ...prefsOf(S) });
  lastSynced = JSON.stringify(dataOf(S));
  cacheLocal();
  const el = document.activeElement?.closest?.('.row[data-id]');
  const caret = el ? getCaret(el.querySelector('.text')) : null;
  render();
  if (el) focusRow(el.dataset.id, caret);
}

// The hosted demo (GitHub Pages, or ?demo) has no server: it keeps tasks in this browser only.
const DEMO = location.hostname.endsWith('github.io') || new URLSearchParams(location.search).has('demo');

async function connect() {
  if (DEMO) { online = false; setSync('demo'); return; }
  let server;
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (!r.ok) throw 0;
    server = await r.json();
  } catch {
    online = false;
    setSync(location.protocol === 'file:' ? 'file' : 'offline');
    if (location.protocol !== 'file:') { clearTimeout(retryTimer); retryTimer = setTimeout(connect, 5000); }
    return;
  }
  online = true;
  const cached = (() => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } })();
  if (!server.rev) { rev = 0; return push(); }                     // empty database: seed it from this browser
  if (cached && !cached._synced && cached._rev === server.rev) { rev = server.rev; return push(); }  // offline edits
  adopt(server);
  setSync('saved');
}

// Pick up edits from other windows/devices when this one comes back into focus.
async function refresh() {
  if (!online || pushing || JSON.stringify(dataOf(S)) !== lastSynced || drag) return;
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    const server = await r.json();
    if (server.rev !== rev) adopt(server);

addEventListener('focus', refresh);

addEventListener('pagehide', () => {
  clearTimeout(saveTimer);
  cacheLocal();
  const data = JSON.stringify(dataOf(S));
  if (online && data !== lastSynced) {
    fetch('api/state', { method: 'PUT', keepalive: true, headers: { 'content-type': 'application/json' }, body: `{"baseRev":${rev},"data":${data}}` });
  }

function setSync(state) {

    offline: ['Offline. Changes are kept in this browser and will sync when the server is back', 'warn'],
    file: ['Not saved to the database. Run node server.js and open http://localhost:4321', 'warn'],
    demo: ['Demo: your tasks are saved only in this browser', ''],
  };
  const [text, cls] = labels[state];
  el.textContent = { saved: '✓ Saved', saving: 'Saving…', offline: '● Offline', file: '● Local only', demo: 'Demo · saved in this browser' }[state];
  el.title = text;

const isEditing = () => document.activeElement?.classList?.contains('text');

const proj = id => S.projects.find(p => p.id === id);

/* ───────────── list contexts ─────────────

    defaultProject: () => pid,

const mixCtx = {
  key: 'mix',
  get() {

    const out = [];
    for (const pid of S.mix) {
      const q = queues.get(pid);
      if (q && q.length) out.push(...q.shift());
    }
    for (let more = true; more;) {
      more = false;

  set(flat) {

      if (!by.has(pid)) pid = S.projects[0].id;
      // A subtask always belongs to its top-level task's project.
      b.forEach(r => { S.tasks[r.id].project = pid; });

const LISTS = new Map();

/* ───────────── urgency ───────────── */

/* ───────────── rendering ───────────── */

/* FLIP: animate rows from where they were to where they are now. */

  });
  if (caret != null) focusRow(ids[0], caret);
}

// Move tasks (with their subtasks) past the neighbouring sibling.
function moveBlock(ctx, ids, dir, caret) {
  mutate(ctx, flat => {
    const [i, end] = span(flat, ids), d = flat[i].depth;
    if (dir < 0) {
      let j = i - 1;
      while (j >= 0 && flat[j].depth > d) j--;
      if (j < 0 || flat[j].depth < d) return false;   // no earlier sibling
      flat.splice(j, 0, ...flat.splice(i, end - i));
    } else {
      if (end >= flat.length || flat[end].depth > d) return false;
      const nEnd = blockEnd(flat, end);
      const block = flat.splice(i, end - i);
      flat.splice(nEnd - block.length, 0, ...block);
    }
  });
  if (caret != null) focusRow(ids[0], caret);
}

function sameList(a, b) { return a && b && !b.classList.contains('ghost') && a.closest('.list') === b.closest('.list'); }

function backspace(e, ctx, row, el) {
  const id = row.dataset.id, text = textOf(el), d = +row.dataset.depth;
  if (text && d > 0) { e.preventDefault(); return shiftDepth(ctx, [id], -1, 0); }
  const prev = siblingRow(row, -1);
  if (!text) {
    e.preventDefault();
    const target = sameList(row, prev) ? prev : siblingRow(row, 1);
    mutate(ctx, flat => removeRow(flat, idx(flat, id)));
    if (target?.dataset.id) focusRow(target.dataset.id, target === prev ? 'end' : 'start');
    else focusEl($(`.list[data-ctx="${ctx.key}"] .ghost`));
    return;
  }
  if (!sameList(row, prev)) return;
  e.preventDefault();
  mergeInto(ctx, prev.dataset.id, id);
}

// Append task `fromId`'s text onto `intoId` and remove `fromId`.
function mergeInto(ctx, intoId, fromId) {
  const into = S.tasks[intoId], from = S.tasks[fromId];
  const caret = into.text.length;
  mutate(ctx, flat => {
    into.text += from.text;
    into.deadline ??= from.deadline;
    into.estimate ??= from.estimate;
    removeRow(flat, idx(flat, fromId));
  });
  focusRow(intoId, caret);
}

function toggleDone(id, keepFocus) {
  const t = S.tasks[id];
  const caret = keepFocus ? getCaret(rowById(id).querySelector('.text')) : 0;
  const next = keepFocus && S.hideDone && !t.done ? siblingRow(rowById(id), 1) : null;
  t.done = !t.done;
  const pos = capture();
  save(); render(); play(pos);
  if (!keepFocus) return;
  if (next?.dataset.id) focusRow(next.dataset.id, 'start');
  else if (rowById(id) && !rowById(id).classList.contains('hidden')) focusRow(id, caret);
}

// Delete tasks and their subtasks, with undo.
function deleteMany(ids) {
  const snap = JSON.stringify(S), set = new Set(ids);
  let n = 0;
  for (const p of S.projects) {
    const out = [];
    let skip = -1;
    for (const r of p.items) {
      if (skip >= 0 && r.depth > skip) { n++; continue; }
      skip = -1;
      if (set.has(r.id)) { skip = r.depth; n++; continue; }
      out.push(r);
    }
    p.items = normalize(out);
  }
  rsel = null;
  closePop(); gc(); save();
  const pos = capture(); render(); play(pos);
  toast(n === 1 ? 'Task deleted' : `Deleted ${n} tasks`, () => restore(snap));
}

function doneMany(ids) {
  const done = !ids.every(id => S.tasks[id].done);
  ids.forEach(id => { S.tasks[id].done = done; });
  const pos = capture();
  save(); render(); play(pos);
}

function setProject(id, pid) {
  const t = S.tasks[id];
  if (t.project === pid) return;
  const from = proj(t.project), i = idx(from.items, id), d = from.items[i].depth;
  if (S.view === 'all' && S.allMode === 'mix' && d === 0) {
    // Keep its slot in the interleaved list; only the colour/project changes.
    const flat = mixCtx.get();
    const end = blockEnd(flat, idx(flat, id));
    for (let j = idx(flat, id); j < end; j++) S.tasks[flat[j].id].project = pid;
    mixCtx.set(flat);
  } else {
    // Move the task (and its subtasks) to the end of the other project.
    const block = from.items.splice(i, blockEnd(from.items, i) - i).map(r => ({ id: r.id, depth: r.depth - d }));
    normalize(from.items);
    block.forEach(r => { S.tasks[r.id].project = pid; });
    proj(pid).items.push(...block);
  }
  S.lastProject = pid;
  save(); render();
}

/* Multi-line paste: each line becomes a task; indentation, bullets and [x] are understood. */
function pasteLines(el, txt) {
  const row = el.closest('.row'), ctx = ctxOf(row);
  const raw = txt.replace(/\n+$/, '').split('\n').filter(l => l.trim());
  if (!raw.length) return;
  const parsed = raw.map(l => {
    const m = /^([ \t]*)(?:[-*•+]\s+|\d+[.)]\s+)?(?:\[([ xX])\]\s*)?(.*)$/.exec(l);
    return { ws: m[1].replace(/\t/g, '    ').length, done: /x/i.test(m[2] || ''), text: m[3] };
  });
  const levels = [...new Set(parsed.map(p => p.ws))].sort((a, b) => a - b);
  parsed.forEach(p => { p.depth = levels.indexOf(p.ws); });
  const ghost = row.classList.contains('ghost');
  const pid = ghost ? ctx.defaultProject() : S.tasks[row.dataset.id].project;
  let lastId;
  mutate(ctx, flat => {
    let at, base, after = '';
    if (ghost) { at = flat.length; base = 0; }
    else {
      const t = S.tasks[row.dataset.id], off = getCaret(el), text = textOf(el);
      const first = parsed.shift();
      t.text = text.slice(0, off) + first.text;
      after = text.slice(off);
      const i = idx(flat, t.id);
      at = i + 1; base = flat[i].depth - first.depth;
      lastId = t.id;
    }
    for (const p of parsed) {
      const n = newTask(pid, p.text);
      n.done = p.done;
      flat.splice(at++, 0, { id: n.id, depth: Math.max(0, base + p.depth) });
      lastId = n.id;
    }
    S.tasks[lastId].text += after;
    if (after) S.tasks[lastId]._caret = S.tasks[lastId].text.length - after.length;
  });
  const caret = S.tasks[lastId]._caret ?? 'end';
  delete S.tasks[lastId]._caret;
  focusRow(lastId, caret);
}

/* ───────────── row selection ─────────────
   A contiguous run of visible rows in one list, from `anchor` to `head` (like selecting lines).
   While it is active, keyboard focus sits on #lists itself rather than in a task's text. */
let rsel = null;

function selRows() {
  if (!rsel) return [];
  const list = $(`.list[data-ctx="${rsel.key}"]`);
  if (!list) return [];
  const rows = $$('.row[data-id]:not(.hidden)', list);
  const a = rows.findIndex(r => r.dataset.id === rsel.anchor), h = rows.findIndex(r => r.dataset.id === rsel.head);
  if (a < 0 || h < 0) return [];
  return rows.slice(Math.min(a, h), Math.max(a, h) + 1);
}
const selIds = () => selRows().map(r => r.dataset.id);

function paintSel() {
  $$('#lists .row.selected').forEach(r => r.classList.remove('selected'));
  const rows = selRows();
  if (rsel && !rows.length) rsel = null;
  rows.forEach(r => r.classList.add('selected'));
  $('#selbar').hidden = !rsel;
  if (rsel) $('#selcount').textContent = `${rows.length} selected`;
}

function select(key, anchor, head) {
  rsel = { key, anchor, head };
  if (document.activeElement !== listsEl) {
    getSelection().removeAllRanges();
    listsEl.focus({ preventScroll: true });
  }
  paintSel();
  rowById(head)?.scrollIntoView({ block: 'nearest' });
}

function clearSel(edit) {
  if (!rsel) return;
  const head = rsel.head;
  rsel = null;
  paintSel();
  if (edit) focusRow(head, 'end');
}

function selectAll(key) {
  const rows = $$(`.list[data-ctx="${key}"] .row[data-id]:not(.hidden)`);
  if (rows.length) select(key, rows[0].dataset.id, rows.at(-1).dataset.id);
}

// Selected tasks as an indented outline; pasting it back recreates them.
function selAsText() {
  const flat = LISTS.get(rsel.key).get();
  const [i, end] = span(flat, selIds());
  const rows = flat.slice(i, end), base = Math.min(...rows.map(r => r.depth));
  return rows.map(r => {
    const t = S.tasks[r.id];
    return '  '.repeat(r.depth - base) + '- ' + (t.done ? '[x] ' : '') + t.text.replace(/\n/g, ' ');
  }).join('\n');
}

function selKey(e) {
  const ctx = LISTS.get(rsel.key), ids = selIds(), mod = e.ctrlKey || e.metaKey;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const dir = e.key === 'ArrowUp' ? -1 : 1;
    if (e.altKey) return moveBlock(ctx, ids, dir);
    if (e.shiftKey) {
      const rows = $$(`.list[data-ctx="${rsel.key}"] .row[data-id]:not(.hidden)`);
      const next = rows[rows.findIndex(r => r.dataset.id === rsel.head) + dir];
      if (next) select(rsel.key, rsel.anchor, next.dataset.id);
      return;
    }
    const rows = selRows(), target = dir < 0 ? rows[0] : rows.at(-1);
    rsel = null;
    paintSel();
    return focusEl(target, dir < 0 ? 'start' : 'end');
  }
  switch (e.key) {
    case 'Escape': e.preventDefault(); return clearSel(true);
    case 'Enter': e.preventDefault(); return mod ? doneMany(ids) : clearSel(true);
    case 'Backspace': case 'Delete': e.preventDefault(); return deleteMany(ids);
    case 'Tab': e.preventDefault(); return shiftDepth(ctx, ids, e.shiftKey ? -1 : 1);
  }
  if (mod && e.key === '.') { e.preventDefault(); return openDetails(rsel.head); }
  if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); return selectAll(rsel.key); }
  if (!mod && !e.altKey && e.key.length === 1) {   // typing drops back into editing the head task
    e.preventDefault();
    clearSel(true);
    insertText(e.key);
  }
}

document.addEventListener('copy', e => {
  if (!rsel || document.activeElement !== listsEl) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain', selAsText());
});
document.addEventListener('cut', e => {
  if (!rsel || document.activeElement !== listsEl) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain', selAsText());
  deleteMany(selIds());
});

// Shift+click extends a selection; any other click elsewhere drops it.
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('#lists .row[data-id]');
  if (e.shiftKey && row && !e.target.closest('.grip')) {
    e.preventDefault();
    const key = row.closest('.list').dataset.ctx;
    const editing = document.activeElement?.closest?.('.row[data-id]');
    const anchor = rsel?.key === key ? rsel.anchor
      : editing && editing.closest('.list').dataset.ctx === key ? editing.dataset.id : row.dataset.id;
    return select(key, anchor, row.dataset.id);
  }
  if (!rsel || e.target.closest('#selbar, #pop')) return;
  if (row?.classList.contains('selected') && e.target.closest('.grip, .meta, .check')) return;
  clearSel(false);
}, true);

$('#selbar').addEventListener('click', e => {
  const act = e.target.closest('[data-sel]')?.dataset.sel;
  if (!act || !rsel) return;
  if (act === 'done') doneMany(selIds());
  else if (act === 'details') openDetails(rsel.head);
  else if (act === 'delete') deleteMany(selIds());
  else clearSel(false);
});

/* ───────────── list events ───────────── */
listsEl.addEventListener('keydown', e => {
  if (rsel && e.target === listsEl) return selKey(e);
  const el = e.target.closest?.('.text');
  if (!el || e.isComposing) return;
  const row = el.closest('.row'), ctx = ctxOf(row);
  const mod = e.ctrlKey || e.metaKey;

  if (row.classList.contains('ghost')) {
    if (e.key === 'ArrowUp' || (e.key === 'Backspace' && !textOf(el))) {
      const p = siblingRow(row, -1);
      if (p) { e.preventDefault(); focusEl(p, 'end'); }
    } else if (e.key === 'ArrowDown') {
      const n = siblingRow(row, 1);
      if (n) { e.preventDefault(); focusEl(n, 'start'); }
    } else if (e.key === 'Enter' || e.key === 'Tab') e.preventDefault();
    else if (e.key === 'Escape') el.blur();
    return;
  }

  const id = row.dataset.id;
  const collapsed = getSelection().isCollapsed;
  switch (e.key) {
    case 'Enter':
      if (e.shiftKey && !mod) return;   // the browser's own line break
      e.preventDefault();
      if (mod) return toggleDone(id, true);
      return enter(ctx, id, el);
    case 'Tab':
      e.preventDefault();
      return shiftDepth(ctx, [id], e.shiftKey ? -1 : 1, getCaret(el));
    case 'Backspace':
      if (collapsed && !mod && getCaret(el) === 0) backspace(e, ctx, row, el);
      return;
    case 'Delete': {
      if (!collapsed || getCaret(el) !== textOf(el).length) return;
      const next = siblingRow(row, 1);
      if (sameList(row, next)) { e.preventDefault(); mergeInto(ctx, id, next.dataset.id); }
      return;
    }
    case 'ArrowUp':
    case 'ArrowDown': {
      const dir = e.key === 'ArrowUp' ? -1 : 1;
      if (e.altKey && !e.shiftKey) { e.preventDefault(); return moveBlock(ctx, [id], dir, getCaret(el)); }
      if (e.shiftKey && !mod && !e.altKey && onEdgeLine(el, dir < 0 ? 'first' : 'last')) {
        // Shift+arrow off the edge of a task's text starts selecting whole tasks.
        e.preventDefault();
        const next = siblingRow(row, dir);
        return select(ctx.key, id, sameList(row, next) ? next.dataset.id : id);
      }
      if (e.shiftKey || mod || !collapsed) return;
      if (!onEdgeLine(el, dir < 0 ? 'first' : 'last')) return;
      const target = siblingRow(row, dir);
      if (target) { e.preventDefault(); focusEl(target, dir < 0 ? 'end' : 'start'); }
      return;
    }
    case '.':
      if (mod) { e.preventDefault(); openDetails(id); }
      return;
    case 'a':
    case 'A':
      // Ctrl+A in a task whose text is already all selected (or empty) selects every task.
      if (!mod || e.shiftKey || getSelection().toString().length < textOf(el).length) return;
      e.preventDefault();
      return selectAll(ctx.key);
    case 'Escape':
      el.blur();
  }
});

listsEl.addEventListener('input', e => {
  const el = e.target.closest('.text');
  if (!el) return;
  const row = el.closest('.row');
  if (row.classList.contains('ghost')) {
    const text = textOf(el);
    if (!text) return;
    const ctx = ctxOf(row), pid = ctx.defaultProject();
    let nid;
    mutate(ctx, flat => { nid = newTask(pid, text).id; flat.push({ id: nid, depth: 0 }); });
    focusRow(nid, 'end');
    return;
  }
  S.tasks[row.dataset.id].text = textOf(el);
  save();
});

listsEl.addEventListener('paste', e => {
  const el = e.target.closest('.text');
  if (!el) return;
  e.preventDefault();
  const txt = (e.clipboardData?.getData('text/plain') || '').replace(/\r\n?/g, '\n');
  if (txt.replace(/\n+$/, '').includes('\n')) pasteLines(el, txt);
  else insertText(txt.replace(/\n+$/, ''));
});

listsEl.addEventListener('click', e => {
  const row = e.target.closest('.row');
  const nameBtn = e.target.closest('.sec .name');
  if (nameBtn) { S.view = nameBtn.dataset.view; save(); render(); return; }
  if (e.target.closest('.gdot')) return openGhostProjectMenu(e.target.closest('.gdot'));
  if (row?.dataset.id) {
    if (e.target.closest('.check')) return row.classList.contains('selected') ? doneMany(selIds()) : toggleDone(row.dataset.id, false);
    if (e.target.closest('.meta')) return openDetails(row.dataset.id);
  }
  if (e.shiftKey) return;
  if (row && !e.target.closest('.text, .grip, button')) return focusEl(row, 'end');
  const list = e.target.closest('.list');
  if (list && e.target === list) focusEl($('.ghost', list), 'end');
});

/* ───────────── drag & drop ───────────── */
let drag = null;

listsEl.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip || e.button > 0) return;
  const row = grip.closest('.row');
  if (row.classList.contains('ghost')) return;
  e.preventDefault();
  const listEl = row.closest('.list');
  const rows = $$('.row[data-id]', listEl);
  // Grabbing a selected row drags the whole selection.
  const picked = row.classList.contains('selected') ? selRows() : [row];
  const i = rows.indexOf(picked[0]), last = rows.indexOf(picked.at(-1)), d = +picked[0].dataset.depth;
  let end = last + 1;
  for (let j = i; j <= last; j++) {
    let k = j + 1;
    while (k < rows.length && +rows[k].dataset.depth > +rows[j].dataset.depth) k++;
    end = Math.max(end, k);
  }
  const block = rows.slice(i, end);
  const ind = document.createElement('div');
  ind.className = 'drop-ind';
  ind.hidden = true;
  ind.style.setProperty('--ic', projColor(S.tasks[row.dataset.id].project));
  listEl.append(ind);
  drag = {
    listEl, ctx: LISTS.get(listEl.dataset.ctx), block, d, ind, moved: false,
    others: rows.filter(r => !block.includes(r) && !r.classList.contains('hidden')),
    x0: e.clientX, y0: e.clientY, scroll0: scrollY, before: null, depth: d,
    top0: block[0].getBoundingClientRect().top + scrollY,
  };
  addEventListener('pointermove', onDragMove);
  addEventListener('pointerup', onDragEnd);
  addEventListener('pointercancel', onDragEnd);
});

function onDragMove(e) {
  if (!drag) return;
  drag.lastX = e.clientX; drag.lastY = e.clientY;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0 + (scrollY - drag.scroll0);
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    closePop();
    document.activeElement?.blur?.();
    drag.block.forEach(r => r.classList.add('dragging'));
    document.body.classList.add('is-dragging');
  }
  const { others } = drag;
  let k = others.findIndex(r => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; });
  const before = k < 0 ? null : others[k];
  const prev = k < 0 ? others[others.length - 1] : others[k - 1] || null;
  const maxD = prev ? +prev.dataset.depth + 1 : 0;
  // Dropping above someone's subtask must be at least that deep, or it would adopt them.
  const minD = before ? Math.min(+before.dataset.depth, maxD) : 0;
  drag.before = before;
  drag.depth = clamp(drag.d + Math.round(dx / INDENT), minD, maxD);

  const lr = drag.listEl.getBoundingClientRect();
  const y = before ? before.getBoundingClientRect().top : prev ? prev.getBoundingClientRect().bottom : lr.top + 2;

  // The dragged rows sit in the drop slot just under the line, at the depth they'll land at...
  const dxSnap = (drag.depth - drag.d) * INDENT;
  const dySnap = y + scrollY + 5 - drag.top0;
  drag.block.forEach(r => { r.style.transform = `translate(${dxSnap}px, ${dySnap}px)`; });
  // ...and the task that would become their parent is highlighted.
  let parent = null;
  if (drag.depth > 0) {
    for (let j = k < 0 ? others.length - 1 : k - 1; j >= 0; j--) {
      if (+others[j].dataset.depth < drag.depth) { parent = others[j]; break; }
    }
  }
  if (parent !== drag.parent) {
    drag.parent?.classList.remove('drop-parent');
    parent?.classList.add('drop-parent');
    drag.parent = parent;
  }

  drag.ind.hidden = false;
  drag.ind.style.top = (y - lr.top - 1.5) + 'px';
  drag.ind.style.left = (8 + drag.depth * INDENT + 26) + 'px';

  // Auto-scroll near viewport edges.
  const edge = 70;
  if (e.clientY < edge + 110) scrollBy(0, -Math.ceil((edge + 110 - e.clientY) / 6));
  else if (e.clientY > innerHeight - edge) scrollBy(0, Math.ceil((e.clientY - innerHeight + edge) / 6));
}

function onDragEnd(e) {
  removeEventListener('pointermove', onDragMove);
  removeEventListener('pointerup', onDragEnd);
  removeEventListener('pointercancel', onDragEnd);
  const dr = drag;
  drag = null;
  if (!dr) return;
  document.body.classList.remove('is-dragging');
  dr.ind.remove();
  dr.parent?.classList.remove('drop-parent');
  const cleanup = () => dr.block.forEach(r => { r.classList.remove('dragging'); r.style.transform = ''; });
  if (!dr.moved || e.type === 'pointercancel') return cleanup();

  const ids = new Set(dr.block.map(r => r.dataset.id));
  const pos = capture();
  const flat = dr.ctx.get();
  const moving = flat.filter(r => ids.has(r.id));
  const rest = flat.filter(r => !ids.has(r.id));
  const delta = dr.depth - dr.d;
  moving.forEach(r => { r.depth = Math.max(0, r.depth + delta); });
  let at = dr.before ? idx(rest, dr.before.dataset.id) : rest.length;
  if (at < 0) at = rest.length;
  rest.splice(at, 0, ...moving);
  dr.ctx.set(rest);
  gc(); save(); render(); play(pos);
}

/* ───────────── popovers ───────────── */
let popState = null;

function openPop(state, anchorFn) {
  popState = { ...state, anchorFn };
  refreshPop();
  pop.hidden = false;
  placePop();
}
function closePop(refocus) {
  if (!popState) return;
  const st = popState;
  popState = null;
  pop.hidden = true;
  if (refocus && st.type === 'task') focusRow(st.id, 'end');
}
function placePop() {
  if (!popState) return;
  const a = popState.anchorFn();
  if (!a) return closePop();
  const r = a.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = clamp(r.right - w, 12, innerWidth - w - 12);
  let top = r.bottom + 6;
  if (top + h > innerHeight - 12 && r.top - h - 6 > 12) top = r.top - h - 6;
  pop.style.left = left + 'px';
  pop.style.top = Math.max(12, top) + 'px';
}
function refreshPop() {
  if (!popState) return;
  const st = popState;
  if (st.type === 'task') {
    if (!S.tasks[st.id]) return closePop();
    if (pop.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') { updateStatus(); placePop(); return; }
    pop.innerHTML = detailsHTML(S.tasks[st.id]);
    updateStatus();
  } else if (st.type === 'project') {
    if (!proj(st.pid)) return closePop();
    if (!pop.contains(document.activeElement)) pop.innerHTML = projectHTML(proj(st.pid));
    else $$('.swatch', pop).forEach(s => s.classList.toggle('on', s.dataset.v === proj(st.pid).color));
  } else if (st.type === 'ghost') {
    pop.innerHTML = `<h3>New tasks go to</h3><div class="opts">${S.projects.map(p =>
      `<button class="opt${p.id === S.lastProject ? ' on' : ''}" data-act="ghost" data-v="${p.id}" style="--c:${p.color}"><span class="dot"></span>${esc(p.name)}</button>`).join('')}</div>`;
  } else if (st.type === 'menu') {
    pop.innerHTML = menuHTML();
  }
  placePop();
}
addEventListener('resize', placePop);
addEventListener('scroll', placePop, { passive: true });
document.addEventListener('pointerdown', e => {
  if (popState && !pop.contains(e.target) && !e.target.closest('.meta, .tab.on, #menuBtn, .gdot')) closePop();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && popState) { e.preventDefault(); closePop(true); }
});

const toLocalInput = ms => ms ? new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';

function openDetails(id) {
  if (popState?.type === 'task' && popState.id === id) return closePop(!rsel);
  const ids = rsel && selIds().includes(id) ? selIds() : [id];
  openPop({ type: 'task', id, ids }, () => rowById(id)?.querySelector('.meta'));
}
// The tasks a details popover applies to (minus any deleted since it opened).
const popTargets = () => popState.ids.filter(id => S.tasks[id]);

function detailsHTML(t) {
  const est = t.estimate;
  const ests = [15, 30, 60, 120, 240, 480];
  const n = popState.ids.length;
  return `<h3>${n > 1 ? `${n} tasks` : 'Task details'}</h3>`
    + (S.projects.length > 1 ? `<div class="lbl">Project</div><div class="opts">${S.projects.map(p =>
      `<button class="opt${p.id === t.project ? ' on' : ''}" data-act="proj" data-v="${p.id}" style="--c:${p.color}"><span class="dot"></span>${esc(p.name)}</button>`).join('')}</div>` : '')
    + `<div class="lbl">Deadline</div>
       <div class="opts">
         <button class="opt" data-act="due" data-v="1h">+1h</button>
         <button class="opt" data-act="due" data-v="3h">+3h</button>
         <button class="opt" data-act="due" data-v="eod">Today 5pm</button>
         <button class="opt" data-act="due" data-v="tom">Tomorrow</button>
         <button class="opt" data-act="due" data-v="fri">Friday</button>
         <button class="opt" data-act="due" data-v="week">Next week</button>
       </div>
       <div class="inrow"><input type="datetime-local" id="dueIn" value="${toLocalInput(t.deadline)}" aria-label="Deadline">
         ${t.deadline ? '<button class="opt" data-act="due-clear">Clear</button>' : ''}</div>
       <div class="lbl" style="margin-top:14px">Time to complete</div>
       <div class="opts">${ests.map(m => `<button class="opt${est === m ? ' on' : ''}" data-act="est" data-v="${m}">${fmtDur(m * 6e4)}</button>`).join('')}</div>
       <div class="inrow"><input type="number" id="estIn" min="0" step="0.25" placeholder="Custom" value="${est ? +(est / 60).toFixed(2) : ''}" aria-label="Estimate in hours"><span class="hint">hours</span>
         ${est ? '<button class="opt" data-act="est-clear">Clear</button>' : ''}</div>
       <div class="status" id="ustatus"></div>
       <div class="popfoot"><button class="danger" data-act="del">Delete ${n > 1 ? `${n} tasks` : 'task'}</button><span class="hint"><kbd>Esc</kbd> close</span></div>`;
}

function updateStatus() {
  const box = $('#ustatus', pop);
  if (!box || popState?.type !== 'task') return;
  const t = S.tasks[popState.id];
  if (!t) return;
  if (popState.ids.length > 1) { box.textContent = `Changes here apply to all ${popState.ids.length} selected tasks.`; return; }
  const u = urgency(t);
  if (!t.deadline) {
    box.innerHTML = t.estimate ? `Needs about <b>${fmtDur(t.estimate * 6e4)}</b>. Add a deadline to track urgency.` : 'Add a deadline (and ideally an estimate) and this task will warm from amber to red as the time left approaches the time it needs.';
    return;
  }
  if (t.done) { box.innerHTML = `Done. It was due <b>${esc(fmtFull(t.deadline))}</b>.`; return; }
  const col = u.overdue ? 'hsl(0 78% 50%)' : u.ratio < .2 ? 'var(--faint)' : `hsl(${u.hue} 88% 50%)`;
  box.innerHTML = u.overdue
    ? `<b>Overdue</b> by ${fmtDur(-u.left)}, it was due ${esc(fmtFull(t.deadline))}.<div class="meter"><i style="width:100%;background:${col}"></i></div>`
    : `Due <b>${esc(fmtFull(t.deadline))}</b>, which is ${fmtDur(u.left)} away.<br>Needs ${u.assumed ? 'an assumed ' : ''}${fmtDur(u.need)}, so the ratio is <b>${u.ratio.toFixed(2)}</b>.`
      + `<div class="meter"><i style="width:${Math.min(100, u.ratio * 100)}%;background:${col}"></i></div>`;
}

function deadlinePreset(k) {
  const now = new Date();
  const at = (days, h) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, 0, 0, 0); return d.getTime(); };
  switch (k) {
    case '1h': return Date.now() + H;
    case '3h': return Date.now() + 3 * H;
    case 'eod': { const x = at(0, 17); return x > Date.now() ? x : at(0, 23) + 59 * 6e4; }
    case 'tom': return at(1, 17);
    case 'fri': { let add = (5 - now.getDay() + 7) % 7; if (add === 0 && now.getHours() >= 17) add = 7; return at(add, 17); }
    case 'week': return at(7, 17);
  }
}

function projectHTML(p) {
  return `<h3>Project</h3>
    <div class="inrow" style="margin-top:0"><input id="pname" value="${esc(p.name)}" aria-label="Project name" maxlength="40"></div>
    <div class="lbl">Colour</div>
    <div class="opts" style="gap:8px">${PALETTE.map(c => `<button class="swatch${c === p.color ? ' on' : ''}" data-act="color" data-v="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}</div>
    <div class="popfoot"><button class="danger" data-act="pdel" ${S.projects.length < 2 ? 'disabled title="You need at least one project"' : ''}>Delete project</button>
      <span class="hint">${openCount(p)} open task${openCount(p) === 1 ? '' : 's'}</span></div>`;
}

function openProjectEditor(pid, selectName) {
  openPop({ type: 'project', pid }, () => $(`.tab[data-view="${pid}"]`));
  if (selectName) { const n = $('#pname', pop); n.focus(); n.select(); }
}

function openGhostProjectMenu(btn) {
  if (popState?.type === 'ghost') return closePop();
  openPop({ type: 'ghost' }, () => $('#lists .gdot'));
}

function menuHTML() {
  const themes = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  return `<div class="menu">
    <button data-act="export">Export tasks (JSON)</button>
    <button data-act="import">Import tasks…</button>
    <hr>
    <button data-act="theme">Theme: ${themes[S.theme]}</button>
    <hr>
    <div class="keys-grid" style="padding:6px 9px">
      <kbd>Enter</kbd><span>New task (splits at the cursor)</span>
      <kbd>Shift+Enter</kbd><span>New line in the same task</span>
      <kbd>Tab</kbd><span>Make subtask · <kbd>Shift+Tab</kbd> outdent</span>
      <kbd>Alt+↑ / ↓</kbd><span>Move task up or down</span>
      <kbd>Ctrl+Enter</kbd><span>Toggle done</span>
      <kbd>Ctrl+.</kbd><span>Deadline, estimate, project</span>
      <kbd>Backspace</kbd><span>At start: outdent, merge, or delete if empty</span>
      <kbd>Shift+↑ / ↓</kbd><span>Select tasks (also Shift+click; Ctrl+A twice for all)</span>
      <kbd>Delete</kbd><span>With tasks selected: delete them (Ctrl+C / Ctrl+X copy or cut)</span>
      <kbd>Alt+0…9</kbd><span>Switch tabs</span>
    </div></div>`;
}

pop.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  const t = popState?.type === 'task' ? S.tasks[popState.id] : null;
  const p = popState?.type === 'project' ? proj(popState.pid) : null;
  // Apply to every target task, then rebuild the popover so its buttons show the new values.
  const each = fn => { popTargets().forEach(id => fn(S.tasks[id])); save(); pop.innerHTML = ''; render(); };
  switch (act) {
    case 'proj': popTargets().forEach(id => setProject(id, v)); break;
    case 'due': { const at = deadlinePreset(v); each(x => { x.deadline = at; }); break; }
    case 'due-clear': each(x => { x.deadline = null; }); break;
    case 'est': { const m = t.estimate === +v ? null : +v; each(x => { x.estimate = m; }); break; }
    case 'est-clear': each(x => { x.estimate = null; }); break;
    case 'del': deleteMany(popTargets()); break;
    case 'color': p.color = v; save(); render(); break;
    case 'pdel': deleteProject(p.id); break;
    case 'ghost': S.lastProject = v; save(); closePop(); render(); focusEl($('#lists .ghost')); break;
    case 'export': exportJSON(); closePop(); break;
    case 'import': closePop(); $('#importFile').click(); break;
    case 'theme': S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; save(); applyTheme(); refreshPop(); break;
  }
});
pop.addEventListener('change', e => {
  if (popState?.type !== 'task') return;
  const ts = popTargets().map(id => S.tasks[id]);
  if (e.target.id === 'dueIn') { const at = e.target.value ? new Date(e.target.value).getTime() : null; ts.forEach(t => { t.deadline = at; }); }
  else if (e.target.id === 'estIn') { const h = parseFloat(e.target.value); ts.forEach(t => { t.estimate = h > 0 ? Math.round(h * 60) : null; }); }
  else return;
  save(); render();
});
pop.addEventListener('input', e => {
  if (e.target.id !== 'pname' || popState?.type !== 'project') return;
  proj(popState.pid).name = e.target.value || 'Untitled';
  save(); render();
});
pop.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.target.blur(); if (e.target.id === 'pname') closePop(); }
});

/* ───────────── projects, toolbar, menu ───────────── */
tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  if (tab.id === 'addProject') return addProject();
  const v = tab.dataset.view;
  if (v === S.view && v !== 'all') {
    return popState?.type === 'project' ? closePop() : openProjectEditor(v);
  }
  closePop();
  S.view = v;
  save(); render();
});
tabsEl.addEventListener('dblclick', e => {
  const tab = e.target.closest('.tab');
  if (tab?.dataset.view && tab.dataset.view !== 'all') openProjectEditor(tab.dataset.view);
});

function addProject() {
  const used = new Set(S.projects.map(p => p.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[S.projects.length % PALETTE.length];
  const p = { id: uid(), name: 'New project', color, items: [] };
  S.projects.push(p);
  S.view = p.id;
  S.lastProject = p.id;
  save(); render();
  $(`.tab[data-view="${p.id}"]`).scrollIntoView({ inline: 'nearest', block: 'nearest' });
  openProjectEditor(p.id, true);
}

function deleteProject(pid) {
  const snap = JSON.stringify(S);
  const p = proj(pid);
  S.projects = S.projects.filter(x => x.id !== pid);
  S.mix = S.mix.filter(x => x !== pid);
  if (S.lastProject === pid) S.lastProject = S.projects[0].id;
  S.view = 'all';
  closePop(); gc(); save(); render();
  toast(`Deleted “${p.name}”`, () => restore(snap));
}

function restore(snap) {
  S = repair(JSON.parse(snap));
  save(true); render();
}

$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  S.allMode = b.dataset.mode;
  save(); render();
});
$('#resetMix').addEventListener('click', () => {
  const snap = JSON.stringify(S);
  const pos = capture();
  S.mix = [];
  save(); render(); play(pos);
  toast('Back to round-robin', () => restore(snap));
});
$('#hideDone').addEventListener('change', e => {
  S.hideDone = e.target.checked;
  const pos = capture();
  save(); render(); play(pos);
});
$('#clearDone').addEventListener('click', () => {
  const snap = JSON.stringify(S);
  const scope = S.view === 'all' ? S.projects : [proj(S.view)];
  let n = 0;
  for (const p of scope) {
    for (let i = p.items.length - 1; i >= 0; i--) {
      if (S.tasks[p.items[i].id].done) { removeRow(p.items, i); n++; }
    }
    normalize(p.items);
  }
  if (!n) return toast('No completed tasks here');
  const pos = capture();
  gc(); save(); render(); play(pos);
  toast(`Cleared ${n} completed task${n === 1 ? '' : 's'}`, () => restore(snap));
});
$('#menuBtn').addEventListener('click', () => {
  if (popState?.type === 'menu') return closePop();
  openPop({ type: 'menu' }, () => $('#menuBtn'));
});

function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tasks-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.projects) || typeof data.tasks !== 'object') throw new Error('bad file');
    const snap = JSON.stringify(S);
    S = repair(data);
    save(true); render();
    toast('Tasks imported', () => restore(snap));
  } catch { toast('That file is not a task export'); }
});

document.addEventListener('keydown', e => {
  if (!e.altKey || e.ctrlKey || e.metaKey || !/^Digit\d$/.test(e.code)) return;
  const n = +e.code.slice(5);
  const v = n === 0 ? 'all' : S.projects[n - 1]?.id;
  if (!v) return;
  e.preventDefault();
  closePop();
  S.view = v;
  save(); render();
});

let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button>Undo</button>' : '');
  el.hidden = false;
  if (undo) el.querySelector('button').onclick = () => { el.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 7000 : 2500);
}

render();
tick();
connect();
</script>
</body>
</html>
